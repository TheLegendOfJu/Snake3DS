name: Build 3DS Homebrew

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install 3DS Dependencies
        shell: bash
        run: |
          set -e
          n=0
          until [ "$n" -ge 5 ]
          do
            dkp-pacman -Sy --noconfirm && \
            dkp-pacman -S --needed --noconfirm 3ds-dev && break
            n=$((n+1))
            echo "pacman sync fehlgeschlagen (Versuch $n/5), warte 20s und versuche es erneut..."
            sleep 20
          done
          if [ "$n" -ge 5 ]; then
            echo "::error::Konnte devkitPro-Pakete nach 5 Versuchen nicht laden (pkg.devkitpro.org blockiert vermutlich gerade GitHub-Actions-IPs mit 403). Bitte später erneut pushen."
            exit 1
          fi

      - name: Compile Project
        run: |
          make
          echo "=== Hauptordner ==="
          ls -la
          echo "=== Build Ordner ==="
          ls -la build/ || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Snake3DS-binary
          path: "**/*.3dsx"
