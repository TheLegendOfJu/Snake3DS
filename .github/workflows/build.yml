name: Build 3DS App

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Build
        run: |
          make
          
      - name: Upload 3DSX
        uses: actions/upload-artifact@v3
        with:
          name: Snake3DS-Build
          path: '*.3dsx'
