name: Build 3DS Homebrew

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install 3DS Dependencies
        run: |
          dkp-pacman -Sy --noconfirm devkitpro-keyring
          dkp-pacman -Syu --noconfirm
          dkp-pacman -S --needed --noconfirm 3ds-dev

      - name: Compile Project
        run: |
          make
          echo "=== Hauptordner ==="
          ls -la
          echo "=== Build Ordner ==="
          ls -la build/ || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Snake3DS-binary
          path: "**/*.3dsx"
